<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="20" y1="20" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Dark Background Rounded Container -->
  <rect width="64" height="64" rx="14" fill="#030712"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Shield Shape Glow Background -->
  <path d="M32 10L48 16V28C48 39.5 41.2 49.8 32 54C22.8 49.8 16 39.5 16 28V16L32 10Z" fill="url(#glowGrad)"/>

  <!-- Outer Shield Border -->
  <path d="M32 10L48 16V28C48 39.5 41.2 49.8 32 54C22.8 49.8 16 39.5 16 28V16L32 10Z" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Financial Ledger Bars Inside Shield -->
  <!-- Top Ledger Line -->
  <rect x="23" y="22" width="18" height="3" rx="1.5" fill="url(#barGrad)"/>
  <!-- Middle Ledger Line -->
  <rect x="23" y="28" width="12" height="3" rx="1.5" fill="url(#barGrad)"/>
  <!-- Bottom Ledger Line -->
  <rect x="23" y="34" width="15" height="3" rx="1.5" fill="url(#barGrad)"/>

  <!-- Security Verification Checkmark Dot -->
  <circle cx="41" cy="38" r="4.5" fill="#10b981"/>
  <path d="M39.2 38L40.4 39.2L42.8 36.8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
