name: PR Code Review Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  code_review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenRouter Code Review Script
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          script: |
            const reviewer = require('./.github/scripts/code-review.js');
            await reviewer({ github, context });
